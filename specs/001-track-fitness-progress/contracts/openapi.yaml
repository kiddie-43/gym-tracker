openapi: 3.0.3
info:
  title: Gym Tracker API
  version: 0.1.0
  description: API para registro de entrenamientos, rutinas, dietas, comidas y progreso.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:5000
    description: Local development
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Health check general
      tags: [Health]
      security: []
      responses:
        '200':
          description: Servicio disponible
  /api/catalog/muscle-groups:
    get:
      summary: Listar grupos musculares disponibles
      tags: [Catalog]
      responses:
        '200':
          description: Lista de grupos musculares
  /api/catalog/exercises:
    get:
      summary: Buscar ejercicios del catálogo
      tags: [Catalog]
      parameters:
        - in: query
          name: muscleGroupIds
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - in: query
          name: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de ejercicios filtrados
  /api/catalog/status:
    get:
      summary: Obtener estado de disponibilidad del catálogo
      tags: [Catalog]
      responses:
        '200':
          description: Estado actual del catálogo
  /api/catalog/foods:
    get:
      summary: Buscar alimentos del catálogo
      tags: [Catalog]
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de alimentos filtrados
  /api/workouts:
    get:
      summary: Listar entrenamientos del usuario
      tags: [Workouts]
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Página de entrenamientos
    post:
      summary: Registrar un entrenamiento
      tags: [Workouts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkoutRequest'
      responses:
        '201':
          description: Entrenamiento creado
  /api/workouts/{workoutId}:
    get:
      summary: Obtener detalle de entrenamiento
      tags: [Workouts]
      parameters:
        - $ref: '#/components/parameters/WorkoutId'
      responses:
        '200':
          description: Detalle del entrenamiento
  /api/workouts/summary:
    get:
      summary: Obtener resumen agregado de entrenamientos y comidas
      tags: [Workouts]
      responses:
        '200':
          description: Resumen de dashboard del usuario
  /api/progress/exercises/{exerciseId}:
    get:
      summary: Obtener progreso y comparativas de un ejercicio
      tags: [Progress]
      parameters:
        - $ref: '#/components/parameters/ExerciseId'
        - in: query
          name: range
          schema:
            type: string
            enum: [week, month, quarter]
      responses:
        '200':
          description: Snapshot de progreso del ejercicio
  /api/routines:
    get:
      summary: Listar rutinas del usuario
      tags: [Routines]
      responses:
        '200':
          description: Rutinas del usuario
    post:
      summary: Crear rutina
      tags: [Routines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoutineRequest'
      responses:
        '201':
          description: Rutina creada
  /api/routines/{routineId}:
    get:
      summary: Obtener detalle de rutina
      tags: [Routines]
      parameters:
        - $ref: '#/components/parameters/RoutineId'
      responses:
        '200':
          description: Rutina encontrada
    put:
      summary: Actualizar rutina
      tags: [Routines]
      parameters:
        - $ref: '#/components/parameters/RoutineId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoutineRequest'
      responses:
        '200':
          description: Rutina actualizada
    delete:
      summary: Archivar rutina
      tags: [Routines]
      parameters:
        - $ref: '#/components/parameters/RoutineId'
      responses:
        '204':
          description: Rutina archivada
  /api/routines/suggested-exercises:
    get:
      summary: Sugerir ejercicios según grupos musculares
      tags: [Routines]
      parameters:
        - in: query
          name: muscleGroupIds
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - in: query
          name: query
          schema:
            type: string
      responses:
        '200':
          description: Ejercicios sugeridos
  /api/diets:
    get:
      summary: Listar dietas del usuario
      tags: [Diets]
      responses:
        '200':
          description: Dietas del usuario
    post:
      summary: Crear dieta
      tags: [Diets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDietRequest'
      responses:
        '201':
          description: Dieta creada
  /api/diets/{dietId}:
    get:
      summary: Obtener detalle de dieta
      tags: [Diets]
      parameters:
        - $ref: '#/components/parameters/DietId'
      responses:
        '200':
          description: Dieta encontrada
    put:
      summary: Actualizar dieta
      tags: [Diets]
      parameters:
        - $ref: '#/components/parameters/DietId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDietRequest'
      responses:
        '200':
          description: Dieta actualizada
    delete:
      summary: Archivar dieta
      tags: [Diets]
      parameters:
        - $ref: '#/components/parameters/DietId'
      responses:
        '204':
          description: Dieta archivada
  /api/meals/logs:
    get:
      summary: Consultar comidas registradas
      tags: [Meals]
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Registros de comida del día
    post:
      summary: Registrar comida consumida
      tags: [Meals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMealLogRequest'
      responses:
        '201':
          description: Comida registrada
  /api/meals/history:
    get:
      summary: Consultar historial paginado de comidas
      tags: [Meals]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Historial paginado de comidas
  /api/settings/preferences:
    get:
      summary: Obtener preferencias del usuario
      tags: [Settings]
      responses:
        '200':
          description: Preferencias actuales
    put:
      summary: Actualizar preferencias del usuario
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: Preferencias actualizadas
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkoutId:
      in: path
      name: workoutId
      required: true
      schema:
        type: string
    ExerciseId:
      in: path
      name: exerciseId
      required: true
      schema:
        type: string
    RoutineId:
      in: path
      name: routineId
      required: true
      schema:
        type: string
    DietId:
      in: path
      name: dietId
      required: true
      schema:
        type: string
  schemas:
    CreateWorkoutRequest:
      type: object
      required: [performedAt, status, exerciseEntries]
      properties:
        performedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [completed, incomplete]
        routineId:
          type: string
          nullable: true
        notes:
          type: string
        exerciseEntries:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseEntryInput'
    ExerciseEntryInput:
      type: object
      required: [externalExerciseId, sets]
      properties:
        externalExerciseId:
          type: string
        notes:
          type: string
        sets:
          type: array
          items:
            $ref: '#/components/schemas/SetInput'
    SetInput:
      type: object
      required: [repetitions, completed]
      properties:
        repetitions:
          type: integer
        weight:
          type: number
          format: double
          nullable: true
        restSeconds:
          type: integer
          nullable: true
        completed:
          type: boolean
    CreateRoutineRequest:
      type: object
      required: [name, tags, days]
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        days:
          type: array
          items:
            $ref: '#/components/schemas/RoutineDayInput'
    RoutineDayInput:
      type: object
      required: [dayLabel, exercises]
      properties:
        dayLabel:
          type: string
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/PlannedExerciseInput'
    PlannedExerciseInput:
      type: object
      required: [externalExerciseId, exerciseName, muscleGroupIds, targetSets, targetRepetitions]
      properties:
        externalExerciseId:
          type: string
        exerciseName:
          type: string
        muscleGroupIds:
          type: array
          items:
            type: string
        targetSets:
          type: integer
        targetRepetitions:
          type: integer
        targetRestSeconds:
          type: integer
          nullable: true
        notes:
          type: string
        imageUrl:
          type: string
          nullable: true
    CreateDietRequest:
      type: object
      required: [name, days]
      properties:
        name:
          type: string
        days:
          type: array
          items:
            $ref: '#/components/schemas/DietDayInput'
    DietDayInput:
      type: object
      required: [dayKey, mealSlots]
      properties:
        dayKey:
          type: string
        mealSlots:
          type: array
          items:
            $ref: '#/components/schemas/MealSlotInput'
    MealSlotInput:
      type: object
      required: [slotType, items]
      properties:
        slotType:
          type: string
          enum: [breakfast, lunch, snack, dinner]
        items:
          type: array
          items:
            $ref: '#/components/schemas/MealItemInput'
    MealItemInput:
      type: object
      required: [externalFoodId, quantity, unit]
      properties:
        externalFoodId:
          type: string
        quantity:
          type: number
          format: double
        unit:
          type: string
        calories:
          type: number
          format: double
          nullable: true
    CreateMealLogRequest:
      type: object
      required: [loggedDate, slotType, items]
      properties:
        loggedDate:
          type: string
          format: date
        slotType:
          type: string
          enum: [breakfast, lunch, snack, dinner]
        items:
          type: array
          items:
            $ref: '#/components/schemas/MealItemInput'
    UpdatePreferencesRequest:
      type: object
      required: [calorieTrackingEnabled]
      properties:
        calorieTrackingEnabled:
          type: boolean
        dailyCalorieGoal:
          type: integer
          nullable: true
