openapi: 3.0.3
info:
  title: Gym Tracker Admin Measurement Types API
  version: 0.1.0
  description: Contrato para panel de administracion de mediciones con popup CRUD, importacion CSV y consumo para asignacion de ejercicios.
servers:
  - url: http://localhost:5000
    description: Local development
security:
  - bearerAuth: []

paths:
  /api/admin/measurement-types:
    get:
      summary: Listar tipos de medicion
      tags: [Admin Measurement Types]
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Code'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDirection'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada de tipos de medicion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementTypesPage'
    post:
      summary: Crear tipo de medicion
      tags: [Admin Measurement Types]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMeasurementTypeRequest'
      responses:
        '201':
          description: Tipo de medicion creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementType'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/measurement-types/{id}:
    put:
      summary: Actualizar tipo de medicion
      tags: [Admin Measurement Types]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMeasurementTypeRequest'
      responses:
        '200':
          description: Tipo de medicion actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementType'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Desactivar tipo de medicion (soft delete)
      tags: [Admin Measurement Types]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Tipo de medicion desactivado
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/measurement-types/{id}/reactivate:
    post:
      summary: Reactivar tipo de medicion desactivado
      tags: [Admin Measurement Types]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Tipo de medicion reactivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/measurement-types/import-csv:
    post:
      summary: Importar tipos de medicion desde CSV parseado
      tags: [Admin Measurement Types]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMeasurementTypesRequest'
      responses:
        '200':
          description: Resultado de importacion parcial por fila
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportMeasurementTypesResult'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/admin/measurement-types/assignable:
    get:
      summary: Listar tipos de medicion activos para asignacion en ejercicios
      tags: [Admin Measurement Types]
      responses:
        '200':
          description: Tipos activos asignables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignableMeasurementType'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    IncludeInactive:
      name: includeInactive
      in: query
      required: false
      schema:
        type: boolean
        default: false
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    Code:
      name: code
      in: query
      required: false
      schema:
        type: string
    SortBy:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum: [name, category, key]
        default: name
    SortDirection:
      name: sortDirection
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  responses:
    NotFound:
      description: Recurso no encontrado
    Conflict:
      description: Conflicto de unicidad o regla de negocio
    ValidationError:
      description: Error de validacion de datos de entrada

  schemas:
    MeasurementType:
      type: object
      required: [id, key, name, unit, dataType, category, active, isDeleted, createdAt, updatedAt]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        unit:
          type: string
        dataType:
          type: string
          enum: [integer, decimal, time, boolean, text]
        category:
          type: string
          enum: [strength, cardio, mobility, general]
        description:
          type: string
          nullable: true
        active:
          type: boolean
        isDeleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    MeasurementTypesPage:
      type: object
      required: [items, totalCount, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MeasurementType'
        totalCount:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1

    UpsertMeasurementTypeRequest:
      type: object
      required: [key, name, unit, dataType, category]
      properties:
        key:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        unit:
          type: string
          minLength: 1
        dataType:
          type: string
          enum: [integer, decimal, time, boolean, text]
        category:
          type: string
          enum: [strength, cardio, mobility, general]
        description:
          type: string
          nullable: true

    ImportMeasurementTypesRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ImportMeasurementTypeRow'

    ImportMeasurementTypeRow:
      type: object
      required: [key, name, unit, dataType, category]
      properties:
        key:
          type: string
        name:
          type: string
        unit:
          type: string
        dataType:
          type: string
        category:
          type: string
        description:
          type: string
          nullable: true

    ImportMeasurementTypesResult:
      type: object
      required: [totalRows, createdRows, rejectedRows, rows]
      properties:
        totalRows:
          type: integer
          minimum: 0
        createdRows:
          type: integer
          minimum: 0
        rejectedRows:
          type: integer
          minimum: 0
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ImportMeasurementTypeRowResult'

    ImportMeasurementTypeRowResult:
      type: object
      required: [rowNumber, created]
      properties:
        rowNumber:
          type: integer
          minimum: 1
        key:
          type: string
          nullable: true
        created:
          type: boolean
        reason:
          type: string
          nullable: true
        measurementType:
          oneOf:
            - $ref: '#/components/schemas/MeasurementType'
            - type: 'null'

    AssignableMeasurementType:
      type: object
      required: [id, key, name, unit, dataType, category]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        unit:
          type: string
        dataType:
          type: string
          enum: [integer, decimal, time, boolean, text]
        category:
          type: string
          enum: [strength, cardio, mobility, general]

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT